<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mascotte Dolce AV : petit renard orange avec un casque audio -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3866"/>
      <stop offset="1" stop-color="#141b30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3f5aa8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3f5aa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa64d"/>
      <stop offset="1" stop-color="#f0741c"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#e8661a"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#b8661f"/>
      <stop offset="0.55" stop-color="#5a2a10"/>
      <stop offset="1" stop-color="#26150b"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8384f"/>
      <stop offset="1" stop-color="#a8132c"/>
    </linearGradient>
  </defs>

  <!-- fond -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <!-- petites étoiles -->
  <path d="M410 92 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#ffd27a"/>
  <path d="M92 118 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#ffffff" opacity="0.8"/>
  <circle cx="440" cy="168" r="4" fill="#ffffff" opacity="0.6"/>

  <!-- oreilles -->
  <path d="M136 236 C 132 180 140 120 158 86 C 192 110 222 146 236 180 Z" fill="url(#ear)"/>
  <path d="M376 236 C 380 180 372 120 354 86 C 320 110 290 146 276 180 Z" fill="url(#ear)"/>
  <path d="M158 212 C 156 172 160 136 168 116 C 188 134 206 156 214 178 Z" fill="#ffd9b8"/>
  <path d="M354 212 C 356 172 352 136 344 116 C 324 134 306 156 298 178 Z" fill="#ffd9b8"/>

  <!-- tête -->
  <path d="M256 150 C 334 150 384 196 392 256 C 396 288 414 304 440 322 C 404 334 384 354 362 378
           C 332 410 296 424 256 424 C 216 424 180 410 150 378 C 128 354 108 334 72 322
           C 98 304 116 288 120 256 C 128 196 178 150 256 150 Z" fill="url(#fur)"/>
  <!-- mèche sur le front -->
  <path d="M232 152 C 244 170 252 176 256 192 C 260 176 268 170 280 152 C 270 150 242 150 232 152 Z" fill="#ffb867" opacity="0.9"/>

  <!-- museau / joues blanches -->
  <path d="M78 322 C 118 324 148 304 176 304 C 206 304 232 322 256 334 C 280 322 306 304 336 304
           C 364 304 394 324 434 322 C 402 336 382 356 362 378 C 332 410 296 424 256 424
           C 216 424 180 410 150 378 C 130 356 110 336 78 322 Z" fill="#fff6ec"/>

  <!-- yeux style anime -->
  <g>
    <ellipse cx="194" cy="266" rx="28" ry="34" fill="url(#iris)"/>
    <ellipse cx="318" cy="266" rx="28" ry="34" fill="url(#iris)"/>
    <ellipse cx="194" cy="262" rx="14" ry="18" fill="#1a0e07" opacity="0.85"/>
    <ellipse cx="318" cy="262" rx="14" ry="18" fill="#1a0e07" opacity="0.85"/>
    <circle cx="204" cy="252" r="11" fill="#ffffff"/>
    <circle cx="328" cy="252" r="11" fill="#ffffff"/>
    <circle cx="185" cy="282" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="309" cy="282" r="5" fill="#ffffff" opacity="0.9"/>
    <!-- cils -->
    <path d="M164 246 C 170 228 190 222 210 226" fill="none" stroke="#2a1608" stroke-width="5" stroke-linecap="round"/>
    <path d="M348 246 C 342 228 322 222 302 226" fill="none" stroke="#2a1608" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- joues roses -->
  <ellipse cx="160" cy="326" rx="20" ry="11" fill="#ff8a9a" opacity="0.55"/>
  <ellipse cx="352" cy="326" rx="20" ry="11" fill="#ff8a9a" opacity="0.55"/>

  <!-- nez et bouche -->
  <path d="M242 318 Q256 310 270 318 Q264 334 256 336 Q248 334 242 318 Z" fill="#2a1608"/>
  <ellipse cx="251" cy="317" rx="4" ry="2.5" fill="#ffffff" opacity="0.7"/>
  <path d="M238 346 Q247 356 256 346 Q265 356 274 346" fill="none" stroke="#2a1608" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- casque audio -->
  <path d="M112 262 C 104 116 408 116 400 262" fill="none" stroke="#1b2442" stroke-width="30" stroke-linecap="round"/>
  <path d="M112 262 C 104 116 408 116 400 262" fill="none" stroke="#e9edf8" stroke-width="20" stroke-linecap="round"/>
  <path d="M127 206 Q 145 180 174 166" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <rect x="84" y="232" width="56" height="88" rx="24" fill="url(#cup)" stroke="#1b2442" stroke-width="5"/>
  <rect x="372" y="232" width="56" height="88" rx="24" fill="url(#cup)" stroke="#1b2442" stroke-width="5"/>
  <rect x="96" y="246" width="12" height="40" rx="6" fill="#ffffff" opacity="0.45"/>
  <rect x="384" y="246" width="12" height="40" rx="6" fill="#ffffff" opacity="0.45"/>
</svg>
