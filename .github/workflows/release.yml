# Fabrique l'installateur Windows et le publie dans les « Releases » GitHub.
# Se déclenche quand le numéro de version de package.json change sur la branche principale
# (ou à la main : onglet Actions → « Publier une version » → Run workflow).
# Les applications installées voient la nouvelle version au prochain lancement et se mettent à jour.
name: Publier une version

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

# deux publications de la même version ne se lancent jamais en même temps
concurrency: release

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      # electron-builder fabrique seulement les fichiers (son envoi en parallèle créait des Releases en double) ;
      # gh crée ensuite la Release avec les 3 fichiers d'un coup. Les applications installées lisent latest.yml.
      - name: Fabriquer l'installateur
        run: npx electron-builder --win --publish never
      - name: Publier la Release
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          ls -la dist
          gh release create "v$V" "dist/Stock-AV-Setup-$V.exe" "dist/Stock-AV-Setup-$V.exe.blockmap" dist/latest.yml \
            --title "$V" --notes "Stock AV version $V" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
