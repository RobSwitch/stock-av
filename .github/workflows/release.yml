# Fabrique l'installateur Windows et le publie dans les « Releases » GitHub.
# Se déclenche quand le numéro de version de package.json change sur la branche principale
# (ou à la main : onglet Actions → « Publier une version » → Run workflow).
# Les applications installées voient la nouvelle version au prochain lancement et se mettent à jour.
name: Publier une version

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

# deux publications de la même version ne se lancent jamais en même temps
concurrency: release

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      # La Release est d'abord créée en brouillon (envoi des fichiers sans conflit),
      # puis rendue publique : c'est à ce moment que les applications installées la voient.
      - name: Fabriquer l'installateur et l'envoyer (brouillon)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rendre la version publique
        shell: bash
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
